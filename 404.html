<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="Gzc1k9nfZX6TMoWdZSHCQ6hMluA8CfacZr03ynytZ70" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面走丢了 - Caelus Studio 新闻中心</title>
  <link rel="icon" href="assets/favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/favicon-inverted.png" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg-primary: #0b0b0b;
      --bg-card: #111;
      --text-primary: #f0f0f0;
      --text-secondary: #d0d0d0;
      --text-muted: #888;
      --border-color: rgba(255,255,255,0.06);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.12);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f5f5f5;
        --bg-card: #ffffff;
        --text-primary: #1a1a1a;
        --text-secondary: #2a2a2a;
        --text-muted: #555;
        --border-color: rgba(0,0,0,0.08);
        --accent-soft: rgba(10,132,255,0.10);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.3rem;
      -webkit-font-smoothing: antialiased;
    }

    .nf-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3.2rem 2.6rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .nf-code {
      font-size: 4.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), #6db6ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .nf-card h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.7rem; }

    .nf-card p {
      font-size: 0.92rem;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 1.8rem;
    }

    .nf-actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }

    .nf-btn {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-size: 0.9rem;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .nf-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .nf-btn.primary { background: var(--accent); color: #fff; }

    .nf-btn.ghost {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-soft);
    }
  </style>
</head>
<body>
  <div class="nf-card">
    <div class="nf-code">404</div>
    <h1>这条新闻不存在。</h1>
    <p>你要找的页面可能已被移动或从未发布过。</p>
    <div class="nf-actions">
      <a class="nf-btn primary" href="/">返回新闻中心</a>
      <a class="nf-btn ghost" href="https://www.caelus.top/">访问主站</a>
    </div>
  </div>
</body>
</html>
